html,body{background-color:var(--paper);color:var(--ink)}

.detail-facts dd{font-size:14px}

  <script type="application/json" id="site-content">{"source":{"url":"documents/curriculum.pdf","date":"novembre 2026","label":"Curriculum"},"domains":[{"id":"abitare","title":"Abitare","description":"Edifici plurifamiliari, case e ampliamenti alla scala domestica."},{"id":"recupero","title":"Recupero e riconversione","description":"Nuove destinazioni d’uso, edifici industriali e contesti tutelati."},{"id":"collettivo","title":"Spazi collettivi e commerciali","description":"Cura, infanzia, cultura, commercio e intrattenimento."},{"id":"ospitalita","title":"Ospitalità e sport","description":"Strutture ricettive, piscine, benessere e luoghi per l’attività sportiva."},{"id":"patrimonio","title":"Patrimonio storico","description":"Restauro e consolidamento, attraverso incarichi e collaborazioni specialistiche."},{"id":"territorio","title":"Territorio e paesaggio","description":"Spazi fluviali, fruizione pubblica e interventi sul patrimonio territoriale."},{"id":"infrastrutture","title":"Infrastrutture e sicurezza","description":"Reti di telecomunicazione, coordinamento dei rilievi e sicurezza degli edifici."},{"id":"condomini","title":"Patrimonio condominiale","description":"Consulenza tecnica, manutenzione e riqualificazione del patrimonio condominiale."}],"profile":{"lead":"Architettura, recupero\ne cura dell’esistente.","intro":"STUDIO H2O è lo studio di Andrea di Bartolomeo, architetto a Torino. L’attività professionale, avviata nel 1996, comprende nuove costruzioni, recupero del patrimonio edilizio e progettazione di interni, dal primo studio di fattibilità alla realizzazione.","practice":"Residenze, spazi per l’ospitalità, luoghi collettivi e patrimonio storico sono affrontati attraverso un lavoro di gruppo che tiene insieme progetto architettonico, autorizzazioni, sviluppo esecutivo e direzione lavori.","technical":"Valutazioni immobiliari, analisi tecnico-economiche, computi, capitolati e contabilità di cantiere completano l’attività progettuale. Il percorso comprende consulenze tecniche di parte e sviluppo di iniziative immobiliari.","photography":"Alla progettazione si affianca la fotografia professionale: architettura, still life e cataloghi d’arte, con pubblicazioni su riviste, esposizioni in Italia e all’estero e attività didattica.","property":"Lo studio affianca property manager e amministratori condominiali nella cura degli immobili: verifiche di conformità, pratiche edilizie, capitolati, computi, gestione dei lavori, sicurezza in cantiere e aggiornamenti catastali.","credential":"Iscritto all’Ordine degli Architetti di Torino dal 1996, n. 4019.","milestones":[{"year":"2025","text":"Membro della I Commissione per gli esami di Stato di abilitazione alla professione di architetto, prima e seconda sessione."},{"year":"2001","text":"Socio fondatore di Progetti Associati."},{"year":"1996","text":"Inizio dell’attività di libero professionista e iscrizione all’Ordine degli Architetti di Torino."},{"year":"1995","text":"Laurea in Architettura e abilitazione professionale al Politecnico di Torino."}],"team":"Lo studio si avvale di una struttura multidisciplinare in grado di gestire interamente anche progetti particolarmente complessi, ponendosi come struttura di coordinamento e interlocutore unico per il cliente."},"competitions":[{"year":"2013","title":"Ampliamento della sede dell’Ordine dei Medici Chirurghi","place":"Torino"},{"year":"2000","title":"Corporate design del servizio strade","place":"Provincia autonoma di Bolzano"},{"year":"2000","title":"RI-ABITA · Riuso delle unità immobiliari del tessuto storico","place":""},{"year":"1999","title":"Concert hall","place":"Sarajevo"},{"year":"1994","title":"Riuso della Rotonda Antonelliana","place":"Castellamonte"}],"projects":[{"id":"maison-de-marie","title":"MAISON DE MARIE","featured":true,"category":"collettivo","place":"Torino","address":"Via Bogino","projectLabel":"Atelier a Palazzo Balbo di Vinadio","client":"Maison de Marie s.r.l.","dimensions":"80 m²","status":"Realizzato","scope":["Ristrutturazione edilizia","Ridistribuzione interna","Interior design e arredi su misura"],"description":"Un intervento di ristrutturazione e interior design che unisce il fascino dell’architettura nobiliare torinese a linee contemporanee, calorose e sartoriali.","story":["Intervenire all’interno di un edificio storico di pregio richiede sensibilità, misura e capacità di ascolto del luogo. Questo progetto di ristrutturazione edilizia, ridistribuzione interna e interior design ha dato nuova vita a un esclusivo atelier situato all’interno del prestigioso Palazzo del Conte Balbo di Vinadio, nel cuore storico di Torino. L’obiettivo progettuale è stato creare uno spazio di lavoro e accoglienza altamente funzionale, capace di esprimere un’identità contemporanea senza mai perdere il legame profondo con la memoria storica dell’edificio.","L’organizzazione degli spazi interni è stata pensata per ottimizzare i flussi operativi dell’atelier, distinguendo con naturalezza le aree dedicate all’accoglienza dei clienti e alla prova dei vestiti dagli spazi più riservati alla progettazione e al lavoro creativo, dando vita a una sequenza di ambienti ariosi, coerenti e ben illuminati.","La cifra stilistica dell’intervento risiede nell’equilibrio tra passato e presente. Gli elementi storici preesistenti e l’impianto generale sono stati preservati e valorizzati, diventando la cornice ideale per un linguaggio progettuale moderno ed essenziale. Per evitare la freddezza dell’architettura minimale, la palette cromatica e i materiali sono stati scelti per trasmettere calore e accoglienza: superfici materiche, materiali caldi, tonalità avvolgenti e un’illuminazione studiata ad hoc creano un’atmosfera intima e sofisticata, dove il cliente si sente subito a proprio agio.","A rendere unico l’atelier è la cura quasi sartoriale riservata a ogni singolo dettaglio. Tutti gli arredi sono stati interamente disegnati dai progettisti e realizzati su misura da maestranze artigiane. Partizioni flessibili, sistemi espositivi e contenitori si integrano perfettamente nelle geometrie delle stanze, diventando parte integrante dell’architettura. Il risultato è uno spazio esclusivo, dove la storia di Palazzo Balbo di Vinadio incontra l’innovazione del design contemporaneo in una sintesi armoniosa e senza tempo."],"team":["Andrea di Bartolomeo","Simone Ostorero"],"number":"44","ratio":"4/3","tone":"#e9e5dd","hover":"#e0dbd0","heroId":"facciata","images":[{"id":"facciata","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/maison-de-marie-facciata.jpeg","width":1448,"height":1086,"alt":"MAISON DE MARIE: prospetto dell’edificio con facciata color pesca, persiane e balconi","caption":"L’edificio.","kind":"exterior"},{"id":"salone","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/maison-de-marie-salone.jpeg","width":1448,"height":1086,"alt":"MAISON DE MARIE: salone con tende rosse, travi bianche e parquet geometrico","caption":"Il salone.","kind":"interior"},{"id":"percorso","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/maison-de-marie-percorso.jpeg","width":1086,"height":1448,"alt":"MAISON DE MARIE: percorso espositivo con parquet, luce a soffitto e finestre","caption":"Il percorso espositivo.","kind":"interior"},{"id":"passaggio","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/maison-de-marie-passaggio.jpeg","width":1086,"height":1448,"alt":"MAISON DE MARIE: passaggio incorniciato da tende bianche, con specchio e manichino","caption":"Il passaggio tra gli ambienti.","kind":"interior"},{"id":"dettaglio","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/maison-de-marie-dettaglio.jpeg","width":1086,"height":1448,"alt":"MAISON DE MARIE: dettaglio di travi bianche, tirante metallico ed espositori","caption":"Travi, tiranti ed espositori.","kind":"interior"}],"coverId":"salone","program":"Atelier di moda"},{"id":"nole","title":"Via Nole 65","category":"abitare","place":"Torino","scope":["Progettazione autorizzativa ed esecutiva","Direzione lavori"],"description":"Un nuovo edificio residenziale di dodici appartamenti nel tessuto produttivo in trasformazione di Torino. Mattoni fatti a mano e intonaco bianco definiscono un’architettura che si alleggerisce verso il cielo.","scale":"1.000 m² di lotto · 12 appartamenti","number":"11","tone":"#e4e1da","hover":"#dad5cb","ratio":"3/4","featured":true,"address":"Via Nole 65","client":"Ripe srl","siteArea":"1.000 m²","status":"Realizzato","floors":"7 piani fuori terra","story":["Una parte di città a vocazione produttiva oggetto di profonda riconversione, una via di incerta identità, una carrozzeria che vuole chiudere, un imprenditore d’altri tempi ed uno studio di architettura. Questi gli elementi alla base della costruzione di un nuovo edificio residenziale per appartamenti realizzati a Torino.","All’interno di un lotto di circa 1.000 mq viene progettato e costruito un edificio a 7 piani fuori terra con autorimessa privata interrata, suddiviso in 12 appartamenti di differenti tipologie e dimensioni che tiene in considerazione le esigenze dei futuri abitanti, costantemente al centro del percorso di progettazione. L’edificio è stato concepito con un fronte più chiuso verso strada ed uno più aperto, più “domestico” a sud verso cortile.","I prospetti sono stati pensati in modo tale da creare nello spettatore l’effetto della “smaterializzazione” dell’edificio all’aumentare del numero dei piani; uno zoccolo scuro al piano terra lascia spazio al paramano in mattoni fatti a mano dalla superficie ruvida e dal colore rosso intenso a richiamo della radice produttiva dell’area, che viene al VI e VII piano sostituito dall’intonaco bianco con “una casa sulla casa”, archetipo della casa moderna, aggrappata al monolite sottostante con due artigli in intonaco tinteggiato, dove trovano spazio appartamenti duplex dotati di ampio terrazzo a sud ritagliato nella falda di copertura.","Gli ampi terrazzi verso cortile, protesi verso la luce, sono stati pensati come lame aggettanti che contribuiscono al comfort climatico delle unità ombreggiando durante la stagione calda e lasciando filtrare la luce del sole fino al serramento durante l’inverno così da aumentare l’efficienza energetica dell’intera costruzione. Nella corte interna si trova un’area verde privata con messa a dimora di specie arbustive, alberi da frutto e ad alto fusto con giochi progettati su misura."],"team":["Andrea di Bartolomeo","Cesare Trovato","Giovanni Nociti","Maddalena Alleyson","Michele De Ruvo","Carta e Matite"],"images":[{"id":"angolo","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/via-nole-65-angolo.png","width":1086,"height":1448,"alt":"Via Nole 65 a Torino: vista d’angolo dell’edificio in mattoni rossi con coronamento bianco","caption":"L’edificio nel fronte urbano.","kind":"exterior"},{"id":"prospetto","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/via-nole-65-prospetto.png","width":1086,"height":1448,"alt":"Prospetto frontale di Via Nole 65 con logge, mattoni rossi e intonaco bianco","caption":"Il prospetto verso strada.","kind":"exterior"},{"id":"scorcio","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/via-nole-65-scorcio.png","width":1086,"height":1448,"alt":"Scorcio dal basso della facciata in mattoni e del volume bianco di Via Nole 65","caption":"Mattoni fatti a mano e intonaco bianco.","kind":"exterior"},{"id":"tetti","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/via-nole-65-tetti.png","width":1536,"height":1024,"alt":"Coperture metalliche e terrazzi affacciati sul cortile di Via Nole 65","caption":"Una casa sulla casa. I terrazzi verso il cortile.","kind":"exterior"}],"heroId":"tetti","program":"12 appartamenti · autorimessa interrata"},{"id":"moncalieri-unifamiliari","title":"ALLASON · Pietra, Terra, Legno","category":"abitare","place":"Moncalieri","scope":["Progettazione autorizzativa"],"description":"Un progetto residenziale di nuova costruzione che trae ispirazione dalla geologia del luogo, unendo l’architettura del paesaggio alle più moderne tecnologie per il risparmio energetico.","scale":"3 edifici","number":"10","tone":"#e7e8e1","hover":"#dddfd3","ratio":"4/3","projectLabel":"Tre ville sulla collina di Moncalieri","address":"Strada del Redentore 157–159–161","story":["Immerso nel verde e nella quiete della collina di Moncalieri, questo intervento di nuova costruzione dà vita a un esclusivo complesso composto da tre ville singole: Casa Pietra, Casa Terra e Casa Legno. Il progetto architettonico nasce da un’idea suggestiva e profondamente legata al contesto: immaginare le tre residenze come una vera e propria stratigrafia del sottosuolo che affiora in superficie, assecondando la naturale pendenza del terreno e instaurando un dialogo armonico con il paesaggio circostante.","Ogni villa interpreta, attraverso la scelta dei materiali e delle cromie di facciata, uno degli strati naturali che compongono la collina:","Casa Pietra, collocata nella fascia più bassa, richiama la solidità della roccia madre, radicata con forza nel pendio.","Casa Terra, in posizione intermedia, evoca i toni caldi e materici del suolo fertile, fondendosi con i colori del giardino.","Casa Legno, posta più in alto, celebra la leggerezza e il calore degli elementi naturali che si protendono verso la luce e il bosco.","Questa scansione visiva e materica trasforma l’intervento in un’architettura organica, dove i volumi contemporanei non si impongono sulla natura, ma ne diventano una naturale estensione.","Sotto la veste architettonica raffinata, le tre residenze sono state edificate utilizzando sistemi costruttivi tradizionali, garanzia di solidità strutturale, durabilità nel tempo e ottimo isolamento acustico. L’intero involucro edilizio è stato progettato secondo i più rigorosi criteri di alta efficienza energetica, eliminando i ponti termici e assicurando un microclima interno ideale in ogni stagione dell'anno.","L’attenzione alla sostenibilità ambientale si traduce anche nell’integrazione di impianti tecnologici all’avanguardia. Ciascuna villa è dotata di pannelli solari termici per la produzione di acqua calda sanitaria e di un impianto fotovoltaico dedicato alla generazione di energia elettrica pulita. Questa sinergia permette di abbattere drasticamente i costi di gestione e le emissioni inquinanti, offrendo ai futuri abitanti un comfort abitativo contemporaneo, autonomo e rispettoso dell’ambiente collinare."],"team":["Andrea di Bartolomeo","Gianluca Novero","Paolo Fiordelli","Michele De Ruvo","Mauro Scavino"],"featured":true,"status":"Realizzato","program":"3 ville unifamiliari","heroId":"facciata","images":[{"id":"facciata","kind":"exterior","caption":"Casa Legno. Il prospetto verso il giardino.","alt":"ALLASON: Casa Legno, facciata in legno e intonaco bianco illuminata dal sole","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/allason-facciata.jpg","width":1448,"height":1086},{"id":"giardino","kind":"exterior","caption":"Casa Legno. I volumi e il giardino collinare.","alt":"ALLASON: vista d’insieme di Casa Legno dal giardino, tra prato, rocce e alberi","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/allason-giardino.jpg","width":1448,"height":1086},{"id":"pietra","kind":"exterior","caption":"Casa Pietra. L’ingresso tra le quinte vegetali.","alt":"ALLASON: ingresso di Casa Pietra con rivestimento lapideo e percorso nel verde","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/allason-pietra.jpg","width":1448,"height":1086},{"id":"cantiere","kind":"construction","caption":"Il cantiere e il rapporto con il paesaggio.","alt":"ALLASON: fase di costruzione delle ville sul pendio, con vista sul paesaggio di Moncalieri","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/allason-cantiere.jpg","width":1448,"height":1086},{"id":"soggiorno","kind":"interior","caption":"Casa Legno. La zona giorno sotto la copertura a vista.","alt":"ALLASON: soggiorno e zona pranzo di Casa Legno, con travi bianche, libreria alta e scala in legno","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/allason-soggiorno.jpg","width":1086,"height":1448},{"id":"camino","kind":"interior","caption":"Casa Legno. Il camino, i libri e le opere d’arte.","alt":"ALLASON: soggiorno di Casa Legno con camino, libreria e divano verde","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/allason-camino.jpg","width":1048,"height":1501},{"id":"bagno","kind":"interior","caption":"Casa Legno. Materiali e dettagli del bagno.","alt":"ALLASON: bagno con lavabo su mensola in legno, piastrelle e specchi","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/allason-bagno.jpg","width":1086,"height":1448}]},{"id":"casa-f","title":"CASA F","category":"abitare","place":"Collina di Moncalieri","projectLabel":"Ristrutturazione e interior design","scope":["Ristrutturazione edilizia","Efficientamento energetico","Interior design","Sistemazione del verde"],"description":"Una villa degli anni Sessanta ripensata attraverso la ristrutturazione, la riqualificazione energetica e il disegno degli interni. Spazi luminosi e continui si aprono verso il giardino collinare.","story":["Situata nella suggestiva cornice della collina di Moncalieri, una villa monofamiliare risalente agli anni Sessanta è stata protagonista di un profondo intervento di ristrutturazione edilizia ed efficientamento energetico. L’obiettivo del progetto è stato ripensare completamente l’edificio, superando i limiti costruttivi e distributivi dell’epoca per creare una residenza moderna, luminosa e perfettamente integrata nel paesaggio naturale circostante.","Il primo passo ha riguardato l’involucro esterno, fondamentale per adeguare l'immobile agli standard contemporanei di sostenibilità e comfort. L’edificio è stato dotato di un performante sistema di isolamento termico a cappotto, abbinato al rifacimento completo della copertura, ora coibentata e ventilata. Questi interventi, uniti alla sostituzione dei serramenti e all'aggiornamento impiantistico, hanno permesso di eliminare le dispersioni di calore, migliorando drasticamente le prestazioni energetiche e il benessere abitativo in ogni stagione.","Dal punto di vista strutturale e funzionale, il progetto ha introdotto un significativo ampliamento dei locali interrati, ricavando nuovi volumi di servizio perfettamente asciutti e fruibili, come autorimesse, locali tecnici e aree dedicate al tempo libero. Al contempo, l'abitazione principale è stata oggetto di una totale ridistribuzione planimetrica: la vecchia frammentazione degli spazi tipica del 1960 ha lasciato posto a una zona giorno ampia e fluida, inondata di luce naturale e progettata per favorire la convivialità e la continuità visiva verso l'esterno.","La trasformazione si è completata con uno studio attento dell’interior design e della sistemazione esterna. Gli ambienti interni sono stati pensati e disegnati su misura, privilegiando linee essenziali, materiali naturali e finiture contemporanee che dialogano con la storia dell'edificio. All'esterno, il progetto del verde ha ridisegnato il giardino collinare, creando percorsi armoniosi, aree relax e quinte vegetali che valorizzano la privacy della villa e ne esaltano il legame con il panorama naturale di Moncalieri."],"client":"Privato","dimensions":"840 m²","scale":"840 m²","program":"Villa monofamiliare","status":"Realizzato","team":["Andrea di Bartolomeo","Carlo Bellino","Christian Barberi","Michele De Ruvo"],"featured":true,"number":"45","tone":"#e7e8e1","hover":"#dddfd3","ratio":"4/3","heroId":"salotto-panoramico","images":[{"id":"salotto-panoramico","kind":"interior","caption":"Il salotto e la continuità visiva verso il giardino.","alt":"CASA F: salotto luminoso con divano chiaro, cuscini color ruggine e ampie vetrate","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/casa-f-salotto-panoramico.jpg","width":1448,"height":1086},{"id":"soggiorno","kind":"interior","capt o dei prospetti","Rifacimento della copertura","Coibentazione e impermeabilizzazione dei terrazzi"],"description":"Il risanamento conservativo di un edificio residenziale del primo Novecento, tra restauro dei prospetti, rifacimento della copertura e protezione dei terrazzi. Un intervento che conserva materiali e dettagli storici e rinnova le prestazioni dell’involucro.","story":["Intervenire su un edificio storico richiede equilibrio tra tutela del patrimonio architettonico e messa in sicurezza funzionale. Il progetto di risanamento conservativo, realizzato su un immobile residenziale del primo Novecento, in area a vincolo ambientale e architettonico, nasce con l’obiettivo di arrestare il degrado dovuto al tempo e agli agenti atmosferici, restituendo all’edificio il suo decoro originario e garantendone la piena efficienza nel rispetto di un approccio progettuale rigorosamente filologico.","Il restauro dei prospetti esterni è stato affrontato con un approccio rigorosamente conservativo. Dopo un’accurata rimozione degli intonaci cementizi stratificati nel corso degli anni e consolidamento degli elementi decorativi d'epoca, si è proceduto al rifacimento delle superfici utilizzando esclusivamente cicli a base di calce naturale. Questa scelta tecnica non solo rispetta la matericità e le cromie autentiche dell’architettura primo-novecentesca, ma assicura un’elevata traspirabilità delle murature prevenendo la formazione di condensa interstiziale, muffe e fenomeni di distacco, tipici dei materiali sintetici non compatibili con le murature storiche.","Una parte cruciale dell’intervento ha riguardato la messa in sicurezza della sommità dell’edificio. Il tetto a falde è stato oggetto di un rifacimento completo, che ha previsto la rimozione del manto esistente e la sostituzione integrale della travatura lignea ormai ammalorata. La nuova orditura portante è stata realizzata con legno massello strutturale selezionato, progettato per garantire la massima resistenza meccanica e rispondere alle vigenti normative antisismiche. Il pacchetto di copertura è stato poi completato con strati isolanti e di ventilazione per migliorare il microclima dei piani sottotetto e proteggere la struttura dall'umidità.","Particolare attenzione è stata infine dedicata alle coperture piane e ai terrazzi dell’edificio, punti particolarmente delicati per la tenuta all'acqua. Attraverso la posa di materiali coibenti e sistemi impermeabilizzanti multistrato ad alte prestazioni è stato garantito un miglioramento delle prestazioni termiche dell’edificio ed una protezione totale contro le infiltrazioni meteoriche.","Il risultato è un immobile completamente risanato, dove la bellezza senza tempo dei dettagli storici dialoga con una struttura solida, protetta e perfettamente conservata."],"client":"Condominio Corso Vittorio Emanuele II°","dimensions":"2.800 m²","program":"Edificio residenziale condominiale","status":"Realizzato","team":["Andrea di Bartolomeo","Ermanno Piretta","Ermanno Scalvenzo","Giancarlo Forti"],"featured":true,"number":"46","tone":"#e7e8e1","hover":"#dddfd3","ratio":"4/5","heroId":"facciata","coverId":"facciata","images":[{"id":"facciata","kind":"exterior","caption":"Il prospetto principale e gli elementi decorativi restaurati.","alt":"VEII°: facciata storica ocra con cornici grigie, frontoni e balconi con balaustre","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/veii-facciata-r2.jpg","width":1122,"height":1402},{"id":"cortile-ballatoi","kind":"exterior","caption":"Il cortile e la sequenza dei ballatoi.","alt":"VEII°: facciata del cortile con ballatoi in ferro e torre scala vetrata","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/veii-cortile-ballatoi-r2.jpg","width":1086,"height":1448},{"id":"cortile-archi","kind":"exterior","caption":"Il prospetto del cortile, tra archi e balconi.","alt":"VEII°: prospetto del cortile con grande arco centrale, lesene grigie e balconi","src":"https://studioh20.simoneostorero-to.chatgpt.sit , pensati per durare nel tempo.","Uno degli elementi distintivi del progetto è la creazione di giardini privati di pertinenza. Grazie alla posizione riparata dell’interno cortile, lontana dal traffico e dai rumori urbani, ogni residenza gode di uno spazio esterno riservato e silenzioso. Questi angoli verdi diventano veri e propri prolungamenti della zona giorno: luoghi ideali per il relax all’aria aperta, per cene estive o per coltivare il proprio pollice verde, garantendo un’oasi di tranquillità in pieno contesto urbano.","Alla cura estetica si affianca una profonda riqualificazione impiantistica e strutturale, mirata a raggiungere i più alti standard di comfort termico e acustico. L’involucro edilizio è stato completamente coibentato tramite isolanti termici ad alte prestazioni e serramenti di ultima generazione a taglio termico. L'integrazione di impianti moderni ad alta efficienza assicura una temperatura ideale in ogni stagione, riducendo drasticamente i consumi energetici e l'impatto ambientale, a vantaggio sia della sostenibilità che del risparmio in bolletta.","Il progetto si è concluso con lo studio degli interni sia da un punto di vista cromatico che di design degli arredi progettati e realizzati su misura.","Questo intervento rappresenta un esempio virtuoso di recupero edilizio sostenibile: un luogo che non consuma nuovo suolo, ma restituisce alla città spazi rigenerati, sicuri e ricchi di carattere, pronti ad accogliere nuove storie quotidiane."],"dimensions":"450 m²","program":"7 unità residenziali","client":"Privato","status":"Realizzato","team":["Andrea di Bartolomeo","Carlo Bellino","Christian Barberi","Eliana Perosino","Cristina Scarsella","Vittorio Fraietta","Emilio Garbarini"],"images":[{"id":"cortile","kind":"exterior","caption":"Il cortile riqualificato e i giardini privati delle residenze.","alt":"Via Osasco: cortile con ballatoi metallici, porte rosse numerate e giardini privati","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/v number":"27","tone":"#dde1dd","hover":"#d0d8d0","ratio":"4/3","featured":true,"projectLabel":"Da deposito commerciale ad asilo nido","client":"Joy 2 s.a.s.","dimensions":"850 m²","program":"Asilo nido · Giardino d’inverno","status":"Realizzato","story":["Riconvertire un volume commerciale dismesso in un luogo dedicato all’infanzia è una sfida progettuale che unisce creatività architettonica e rigore normativo. Questo intervento di ristrutturazione edilizia ed efficientamento energetico ha trasformato un vecchio magazzino di elettrodomestici in un asilo nido contemporaneo, ripensato integralmente per accogliere i più piccoli in un contesto sano, stimolante e protetto.","Gli ampi volumi originari del magazzino sono stati oggetto di una totale ridistribuzione planimetrica, studiata per garantire percorsi fluidi, massima sicurezza e il rispetto degli standard igienico-sanitari. La superficie di 850 m² è stata organizzata in aree funzionali distinte ma visivamente connesse: l’area lattanti, un nido protetto con zone dedicate al riposo e alla cura; l’area divezzi, con spazi ampi e dinamici per l’autonomia e la socializzazione; le sale attività e i laboratori, ambienti versatili per la creatività, il gioco motorio e la scoperta sensoriale.","Il cuore del progetto è il grande giardino d’inverno centrale, uno spazio cuscinetto che porta la luce naturale nel cuore dell’edificio. Per renderlo fruibile dodici mesi l’anno, è stata progettata una copertura in pannelli di policarbonato apribile “ad ali di gabbiano”. Nei mesi invernali, la struttura crea un microclima temperato e luminoso dove i bambini possono giocare al riparo dal freddo; durante la bella stagione, l’apertura delle falde trasforma l’ambiente in uno spazio all’aperto ventilato naturalmente.","L’intero involucro edilizio è stato sottoposto a un intervento di efficientamento energetico, con l’isolamento delle superfici opache, nuovi serramenti ad alte prestazioni e impianti di climatizzazione e ricambio d’aria meccanizzato. L’interior design completa l’opera con arredi su misura, materiali atossici, superfici fonoassorbenti e una palette cromatica rilassante, trasformando un ex luogo di stoccaggio in un’architettura accogliente a misura di bambino."],"team":["Andrea di Bartolomeo","Francesco Baldari","Massimo Gili","Mauro Scavino"],"heroId":"facciata","coverId":"facciata","images":[{"id":"facciata","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/asilo-facciata.jpeg","kind":"exterior","width":1448,"height":1086,"alt":"Asilo Papaveri & Papere: facciata con tapparelle colorate, due balconi e ingresso decorato.","caption":"Il prospetto d’ingresso e il colore come segno di riconoscibilità.","sourceName":"1(7).jpg"},{"id":"sala-attivita","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/asilo-sala-attivita.jpeg","kind":"interior","width":2172,"height":724,"alt":"Vista panoramica della sala attività dell’asilo, con arredi in legno su misura, giochi e luce dai lucernari.","caption":"La sala attività: arredi su misura, colore e luce naturale.","sourceName":"4(7).jpg"},{"id":"giardino-inverno-copertura","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/asilo-giardino-inverno-copertura.jpeg","kind":"interior","width":1448,"height":1086,"alt":"Vista del giardino d’inverno con struttura della copertura in policarbonato e giochi.","caption":"Il giardino d’inverno sotto la copertura apribile.","sourceName":"2(7).jpg"},{"id":"giardino-inverno-giochi","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/asilo-giardino-inverno-giochi.jpeg","kind":"interior","width":1448,"height":1086,"alt":"Giardino d’inverno dell’asilo con copertura trasparente, pavimento morbido e arredi per il gioco.","caption":"Il giardino d’inverno e la luce dalla copertura.","sourceName":"3(7).jpg"},{"id":"dettaglio-illuminazione","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/asilo-dettaglio-illuminazione.jpeg","kind":"interior","width":1448,"height":1086 la, con ringhiere metalliche, murature e ascensore vetrato.","caption":"Il vano scala e l’inserimento dell’ascensore vetrato.","sourceName":"5(7).jpg"},{"id":"ingresso","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/mulino-feyles-ingresso.jpeg","kind":"detail","width":1086,"height":1448,"alt":"Portone blu con scritta geometrica metallica e maniglione verticale.","caption":"Il portone d’ingresso e la scritta metallica.","sourceName":"3(8).jpg"},{"id":"mosaico","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/mulino-feyles-mosaico.jpeg","kind":"detail","width":1536,"height":1024,"alt":"Dettaglio del mosaico giallo con scritta LOFTS 101 nella pavimentazione in pietra.","caption":"Il mosaico inserito nella pavimentazione in pietra.","sourceName":"4(8).jpg"},{"id":"ringhiera","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/mulino-feyles-ringhiera.jpeg","kind":"detail","width":1086,"height":1448,"alt":"Dettaglio diagonale della ringhiera in ferro, del bordo blu della scala e delle ombre sull’intonaco.","caption":"La ringhiera: ferro, colore e luce sulle superfici.","sourceName":"6(7).jpg"},{"id":"porta-storica","src":"https://studioh20.simoneostorero-to.chatgpt.site/images/mulino-feyles-porta-storica.jpeg","kind":"interior","width":1086,"height":1448,"alt":"Porta storica a due ante in legno scuro sotto un architrave in mattoni, accanto ai gradini in pietra.","caption":"La porta storica in legno e l’architrave in mattoni.","sourceName":"7(4).jpg"}],"address":"Via San Donato 101","client":"Privato","status":"Realizzato","program":"13 residenze","story":["Riconvertire un’architettura produttiva storica in spazi per l’abitare significa instaurare un dialogo profondo tra la memoria del lavoro e le esigenze della vita contemporanea. Questo intervento di ristrutturazione edilizia, consolidamento strutturale e cambio di destinazione d’uso ha restituito nuova vita a un antico mulino, un tempo utilizzato per la molitura e lo stoccaggio delle granaglie all’interno di imponenti silos. Il progetto ha dato origine a 13 appartamenti, ognuno caratterizzato da tagli spaziali unici e irripetibili.","La linea guida dell’intero progetto, di cui lo studio si è occupato della progettazione preliminare e autorizzativa, è stata il pieno rispetto della struttura esistente, affrontata e tutelata come un vero e proprio oggetto di archeologia industriale. Piuttosto che cancellare i segni del passato produttivo, la progettazione ha scelto di esaltarli, lasciando evidenti le tracce della storia dell’edificio. Le murature portanti, le capriate e gli elementi costruttivi originari sono stati consolidati e integrati nell’architettura domestica, diventando protagonisti degli ambienti interni e degli spazi comuni.","Il recupero ha richiesto un attento lavoro di consolidamento statico per adeguare l’antico opificio alle vigenti normative strutturali ed energetiche, senza alterarne l’identità volumetrica. La successiva ridistribuzione interna ha permesso di ricavare 13 unità abitative a pianta libera con diverse metrature, progettate per sfruttare al meglio le altezze generose e i suggestivi tagli di luce tipici dell’edilizia industriale. L’inserimento di materiali contemporanei come il ferro, il vetro e il legno naturale dialoga per contrasto e armonia con la ruvida autenticità delle superfici storiche.","Il risultato è un complesso residenziale dal carattere fortemente identitario, dove la forza evocativa di un luogo simbolo della tradizione molitoria si fonde con il comfort, la sicurezza e l’eleganza dell’abitare moderno."],"team":["Andrea di Bartolomeo e Marco Bellei (preliminare e autorizzazioni)","Giuanfranco Tozzini","Gianluca Sciascia","Maddalena Alleyson"]},{"id":"casa-mf","title":"CASA MF","featured":true,"category":"recupero","place":"Calosso · Asti","projectLabel":"Un cascinale tra i vigneti","client":"Privato","dimensions":"550 m²","status":"In corso","description":"Il recupero di un antico cascinale tra i vigneti dell’Astigiano diventa il progetto di una residenza estiva. Materiali piemontesi e richiami mediorientali si incontrano attraverso luce, schermature mobili e spazi aperti al paesaggio.","scope":["Ristrutturazione edilizia","Recupero a fini abitativi","Consolidamento strutturale","Ridistribuzione degli spazi interni"],"story":["Nel paesaggio vitivinicolo di Calosso, nell’Astigiano, il progetto recupera un antico cascinale rurale per trasformarlo nella residenza estiva di una famiglia originaria di queste terre e attiva per gran parte dell’anno in Medio Oriente. La casa è pensata per custodire le radici piemontesi e accogliere i riferimenti culturali della vita internazionale dei suoi abitanti.","L’intervento prevede il risanamento e il consolidamento dell’edificio storico, nel rispetto dei vincoli paesaggistici e dei materiali della tradizione locale. La nuova distribuzione supera la frammentazione degli ambienti rurali a favore di spazi ampi e conviviali, dedicati al riposo, al tempo libero e all’ospitalità.","La luce naturale guida il disegno delle facciate. I brise-soleil mobili modulano l’irraggiamento e le ombre durante la giornata; i parapetti metallici, tagliati al laser con motivi geometrici arabi, reinterpretano il filtro delle mashrabiyya mediorientali.","La testata del fabbricato accoglie il progetto di un giardino d’inverno in vetro e metallo, aperto verso la piscina privata e la valle a vigneto. Una serra bioclimatica mette in relazione gli ambienti interni con il paesaggio collinare; al piano interrato è prevista un’area benessere con bagno turco."],"team":["Andrea di Bartolomeo","Valter Carosso","Giada Cossu","Andrea Valsana"],"ratio":"3/2","tone":"#e7e8e1","hover":"#dddfd3","coverId":"vista-sud","heroId":"vista-sud","images":[{"id":"vista-sud","kind":"render","caption":"Vista di progetto da sud. Schermature mobili e giardino d’inverno.","alt":"Casa MF a Calosso: visualizzazione del fronte sud con intonaco rosso, brise-soleil in legno e giardino d’i }

function projectCard(p) {
  return `<article class="project-card"><a class="project-link" href="${projectURL(p)}" aria-label="Apri progetto: ${escapeHTML(p.title)}">${placeholder(p)}<div class="project-meta"><div><h2>${escapeHTML(p.title)}</h2><p>${[placeLabel(p),categoryName(p.category)].filter(Boolean).map(escapeHTML).join(' · ')}</p>${p.credit ? '<span class="card-credit">Collaborazione</span>' : ''}</div><span class="project-open">Apri progetto</span></div></a></article>`;
}

function profileProjectList() {
  return domains.map(d => {
    const entries = projects.filter(p => p.category === d.id);
    if (!entries.length) return '';
    return `<details class="profile-project-group" data-domain="${escapeHTML(d.id)}"><summary><span class="profile-project-domain">${escapeHTML(d.title)}</span><span class="profile-project-count">${entries.length} ${entries.length === 1 ? 'intervento' : 'interventi'}</span></summary><ul class="profile-project-list">${entries.map(p => `<li><div><span>${escapeHTML(({ 'maison-de-marie':'Maison de Marie', 'moncalieri-unifamiliari':'Allason · Pietra, Terra, Legno', 'casa-f':'Casa F', 'loft-osasco':'Via Osasco', 'asili-nido':'Asilo · Papaveri & Papere', 'vandalino':'Vandalino', 'san-donato-loft':'Mulino Feyles', 'casa-mf':'Casa MF', 'patrimonio-condominiale':'Patrimonio condominiale' })[p.id] || p.title)}</span>${p.credit ? '<span class="profile-project-credit">Collaborazione</span>' : ''}</div><span class="profile-project-place">${escapeHTML(placeLabel(p))}</span></li>`).join('')}</ul></details>`;
  }).join('');
}

function projectsPage() {
  return `<section aria-labelledby="page-title">${pageHeading('Progetti', `<div class="heading-side"><p class="practice-line">Nuove architetture e trasformazioni dell’esistente.<br>Una pratica che attraversa funzioni e scale.</p></div>`)}<div class="selection-toolbar"><p class="eyebrow">Progetti selezionati</p><div class="view-switch" role="group" aria-label="Vista dei progetti"><button type="button" data-view="grid" aria-pressed="${view==='grid'}">${gridIcon}Griglia</button><button type="button" data-view="list" aria-pressed="${view==='list'}">${listIcon}Elenco</button></div></div><div class="project-grid ${view==='list'?'list-view':''}">${projects.filter(p => p.featured && p.galleryLayout !== 'mosaic').map(projectCard).join('')}</div>${projects.filter(p => p.featured && p.galleryLayout === 'mosaic').map(collectionIndex).join('')}<div class="end-note"><span>Progettazione architettonica e gestione tecnica, dal 1996.</span><a class="text-link" href="#/profilo">Profilo e CV</a></div></section>`;
}

function homePage() {
  const studio = content.studio;
  return `<section class="home-page" aria-labelledby="page-title"><p class="home-kicker eyebrow">Studio di architettura · Torino</p><div class="home-main"><h1 class="home-mark" id="page-title"><span class="home-h2o">H<span class="home-subscript">2</span>O</span><span class="visually-hidden">${escapeHTML(studio.architect)}</span></h1><div class="home-navigation" aria-label="Esplora lo studio"><a href="#/profilo">Profilo</a><a href="#/progetti">Progetti</a><a href="#/contatti">Contatti</a></div></div><address class="home-contact"><a href="mailto:${escapeHTML(studio.email)}">${escapeHTML(studio.email)}</a><span>${escapeHTML(studio.address)} · ${escapeHTML(studio.postalCode)} ${escapeHTML(studio.city)}</span><span>${escapeHTML(studio.architect)}</span></address></section>`;
}

function profilePage() {
  const profile = content.profile;
  const illustrated = projects.find(p => p.id === 'veii');
  const photo = illustrated.images.find(image => image.id === illustrated.coverId) || illustrated.images[0];
  const stages = [
    ['Fattibilità e valutazioni', 'Analisi tecniche ed economiche e valutazione delle potenzialità delle iniziative immobiliari.'],
    ['Progetto e autorizzazioni', 'Progettazione architettonica, trasformazioni dell’esistente e pratiche edilizie.'],
    ['Sviluppo esecutivo', 'Dettagli costruttivi, capitolati, computi e coordinamento tecnico.'],
    ['Cantiere e sicurezza', 'Direzione lavori, contabilità e coordinamento della sicurezza in cantiere.'],
    ['Attività complementari', 'Ingegneria strutturale, valutazioni acustiche, diagnosi energetiche e termiche, progettazione elettrica.']
  ];
  return `<section class="profile-page" aria-labelledby="page-title">
    ${pageHeading('Profilo', `<div class="profile-curriculum">${sourceLink()}<span>PDF · ${escapeHTML(content.source.date)}</span></div>`)}
    <div class="profile-introduction" id="profile-architecture">
      <div class="profile-introduction-copy"><p class="lead">${escapeHTML(profile.lead).replace(/\n/g, '<br>')}</p><p class="body-copy">${escapeHTML(profile.intro)}</p><p class="body-copy">${escapeHTML(profile.practice)}</p><p class="body-copy">${escapeHTML(profile.team)}</p><p class="profile-credential">${escapeHTML(profile.credential)}</p></div>
      <figure class="profile-architecture"><img src="${escapeHTML(photo.src)}" width="${photo.width}" height="${photo.height}" alt="${escapeHTML(photo.alt)}" decoding="async"><figcaption>VEII° · Risanamento conservativo, Torino</figcaption></figure>
    </div>
    <section class="profile-section" id="profile-skills" aria-labelledby="method-title"><div class="profile-section-heading"><p class="section-label">Le competenze</p><h2 class="section-title" id="method-title">Dal progetto al cantiere.</h2></div><div class="profile-services">${stages.map(([title, text]) => `<div class="profile-service"><h3>${title}</h3><p>${text}</p></div>`).join('')}</div><div class="profile-property"><div><p>${escapeHTML(profile.property)}</p><p>${escapeHTML(profile.technical)}</p><a class="text-link" href="#/progetti/patrimonio-condominiale">Esplora il patrimonio condominiale</a></div></div></section>
    <section class="profile-section profile-background" id="profile-background" aria-labelledby="path-title"><div><p class="section-label">Il percorso</p><h2 class="section-title" id="path-title">Andrea di Bartolomeo.</h2><ol class="profile-milestones">${profile.milestones.map(item => `<li><span>${escapeHTML(item.year)}</span><p>${escapeHTML(item.text)}</p></li>`).join('')}</ol></div><div class="profile-photography"><h2 class="section-title">Architettura e fotografia.</h2><p class="body-copy">${escapeHTML(profile.photography)}</p><details class="profile-competitions"><summary>Concorsi di architettura</summary><ol class="competitions-list">${content.competitions.map(c => `<li><span>${escapeHTML(c.year)}</span><div>${escapeHTML(c.title)}${c.place ? `<small>${escapeHTML(c.place)}</small>` : ''}</div></li>`).join('')}</ol></details></div></section>
    <section class="profile-section" aria-labelledby="profile-projects-title"><div class="profile-section-heading"><p class="section-label">Esperienze di progetto</p><h2 class="section-title" id="profile-projects-title">Progetti per ambito.</h2></div><div class="profile-projects">${profileProjectList()}</div></section>
    <div class="profile-end">${sourceLink()}<a class="text-link" href="#/contatti">Contatta lo studio</a></div>
  </section>`;
}

function contactPage() {
  const studio = content.studio;
  const mapURL = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([studio.address, studio.postalCode + ' ' + studio.city, 'Italia'].join(', '));
  return `<section aria-labelledby="page-title">${pageHeading('Contatti')}<div class="text-layout"><p class="section-label">Parliamone</p><div class="profile-copy contact-layout"><p class="lead">Per un nuovo progetto<br>o una collaborazione.</p><div class="contact-details"><section class="contact-email" aria-labelledby="email-title"><h2 class="eyebrow" id="email-title">Email</h2><a class="email-link" href="mailto:${escapeHTML(studio.email)}">${escapeHTML(studio.email).replace('@', '<wbr>@')}</a><a class="text-link" href="mailto:${escapeHTML(studio.email)}">Scrivi allo studio</a></section><section class="contact-studio" aria-labelledby="studio-title"><h2 class="eyebrow" id="studio-title">Studio</h2><address><strong>${escapeHTML(studio.name)}</strong><br>${escapeHTML(studio.address)}<br>${escapeHTML(studio.postalCode)} ${escapeHTML(studio.city)}</address><a class="text-link" href="${escapeHTML(mapURL)}" target="_blank" rel="noopener">Apri la mappa</a></section></div></div></div></section>`;
}

function orderedProjectPhotos(p) {
  const order = {exterior: 0, construction: 1, interior: 2, detail: 2};
  return [...(p.images || [])].sort((a, b) => (order[a.kind] ?? 0) - (order[b.kind] ?? 0));
}

function projectPhoto(photo, hero = false, placement = '', drawingStyle = '') {
  const orientation = photo.height > photo.width ? ' photo-portrait' : ' photo-landscape';
  return `<figure class="project-photo${hero ? ' project-hero' : ''}${photo.width > photo.height ? ' landscape' : ''}${orientation}${placement ? ' ' + placement : ''}" data-image-id="${escapeHTML(photo.id)}" data-kind="${escapeHTML(photo.kind || 'exterior')}"${drawingStyle ? ' style="' + drawingStyle + '"' : ''}><img src="${escapeHTML(photo.src)}" width="${photo.width}" height="${photo.height}" alt="${escapeHTML(photo.alt)}" loading="${hero ? 'eager' : 'lazy'}" decoding="async">${photo.caption ? '<figcaption>' + escapeHTML(photo.caption) + '</figcaption>' : ''}</figure>`;
}

function projectGallery(photos, title, layout = '') {
  if (!photos.length) return '';
  if (layout === 'mosaic') {
    return `<div class="project-gallery project-gallery-mosaic" aria-label="Documentazione fotografica di ${escapeHTML(title)}">${photos.map(photo => projectPhoto({...photo, caption: ''})).join('')}</div>`;
  }
  if (photos.every(photo => photo.kind === 'drawing' && photo.drawingRegistration)) {
    const reference = photos[0];
    const drawings = photos.map(photo => {
      // Register the same building span, rather than the different sheet margins.
      const ratio = reference.drawingRegistration.span / photo.drawingRegistration.span;
      const width = photo.width * ratio / reference.width * 100;
      const offset = (reference.drawingRegistration.left - photo.drawingRegistration.left * ratio) / reference.width * 100;
      return projectPhoto(photo, false, '', `--drawing-width:${width.toFixed(5)}%;--drawing-offset:${offset.toFixed(5)}%`);
    });
    return `<div class="project-gallery project-gallery-drawings" aria-label="Disegni di ${escapeHTML(title)}">${drawings.join('')}</div>`;
  }
  const rows = [];
  for (let index = 0; index < photos.length;) {
    const first = photos[index++];
    const panoramic = first.width / first.height >= 2.2;
    const next = photos[index];
    const second = !panoramic && next && next.width / next.height < 2.2 ? photos[index++] : null;
    const portrait = first.height > first.width;
    const rowType = panoramic ? 'photo-row-panorama' : !second ? 'photo-row-single' + (portrait ? ' photo-row-portrait' : '') : portrait && second.height > second.width ? 'photo-row-portraits' : portrait ? 'photo-row-portrait-landscape' : second.height > second.width ? 'photo-row-landscape-portrait' : 'photo-row-landscapes';
    rows.push(`<div class="project-gallery-row ${rowType}">${projectPhoto(first, false, 'photo-slot-left')}${second ? projectPhoto(second, false, 'photo-slot-right') : ''}</div>`);
  }
  return `<div class="project-gallery project-gallery-composed" aria-label="Fotografie di ${escapeHTML(title)}">${rows.join('')}</div>`;
}

function projectHero(p, photos) {
  const exteriors = photos.filter(photo => photo.kind === 'exterior');
  const options = exteriors.length ? exteriors : photos;
  return options.find(photo => photo.id === p.heroId) || options[0];
}

function photographedProjectAt(p, offset) {
  const available = projects.filter(project => project.images?.length);
  return available[(available.indexOf(p) + offset + available.length) % available.length];
}

function projectNextLink(p) {
  const previous = photographedProjectAt(p, -1);
  const next = photographedProjectAt(p, 1);
  const link = (project, direction) => {
    const collection = project.galleryLayout === 'mosaic';
    return `<a class="project-pagination-link${collection ? ' is-collection' : ''}" href="${projectURL(project)}"><span class="eyebrow">${collection ? 'Raccolta di interventi' : direction}</span><span class="project-pagination-title">${escapeHTML(project.title)}</span><span class="project-open">${collection ? 'Esplora la raccolta' : 'Apri progetto'}</span></a>`;
  };
  return `<nav class="project-pagination" aria-label="Navigazione tra i progetti">${link(previous, 'Progetto precedente')}${link(next, 'Progetto successivo')}</nav>`;
}

function collectionIndex(p) {
  const previews = orderedProjectPhotos(p);
  return `<section class="collection-index" aria-labelledby="collection-index-title"><a class="collection-index-link" href="${projectURL(p)}" aria-label="Esplora la raccolta: ${escapeHTML(p.title)}"><div class="collection-index-copy"><p class="eyebrow collection-kicker"><span class="collection-mark" aria-hidden="true"></span>Una raccolta di interventi</p><h2 id="collection-index-title">Patrimonio<br>condominiale</h2><p class="collection-index-description">Edifici diversi, un’attività continuativa di consulenza, manutenzione e riqualificazione.</p><span class="project-open">Esplora la raccolta</span></div><div class="collection-index-mosaic" aria-hidden="true">${previews.map(image => '<span class="collection-index-thumb"><img src="' + escapeHTML(image.src) + '" width="' + image.width + '" height="' + image.height + '" alt="" loading="lazy" decoding="async"></span>').join('')}</div></a></section>`;
}

function detailPage(p) {
  if (!p.images?.length) return legacyDetailPage(p);
  if (p.galleryLayout === 'mosaic') return collectionDetailPage(p);
  if (p.sheetPending) return photoOnlyDetailPage(p);
  const photos = orderedProjectPhotos(p);
  const hero = projectHero(p, photos);
  const storyPhoto = photos.find(photo => photo !== hero);
  const panoramicStory = storyPhoto && storyPhoto.width / storyPhoto.height >= 2.5;
  const facts = [
    ['Luogo', [p.address, p.place].filter(Boolean).join(' · ')],
    ['Committente', p.client],
    ['Superficie del lotto', p.siteArea],
    ['Dimensioni', p.dimensions],
    ['Programma', p.program || p.scale],
    ['Piani', p.floors],
    ['Stato', p.status]
  ].filter(([, value]) => value);
  const story = p.story?.length ? p.story : [p.description].filter(Boolean);
  const scope = p.scope?.length ? `<h2 class="eyebrow scope-heading">Attività svolte</h2><ul class="scope-list">${p.scope.map(text => '<li>' + escapeHTML(text) + '</li>').join('')}</ul>` : '';
  const team = p.team?.length ? `<section class="project-team" aria-labelledby="project-team-title"><h2 id="project-team-title">Team di progetto</h2><ul>${p.team.map(name => '<li>' + escapeHTML(name) + '</li>').join('')}</ul></section>` : '';
  return `<article aria-labelledby="page-title"><a class="breadcrumb" href="#/progetti">Torna ai progetti</a><div class="detail-heading"><div><p class="eyebrow">${escapeHTML(categoryName(p.category))}${p.projectLabel ? ' / ' + escapeHTML(p.projectLabel) : ''}</p><h1 id="page-title">${escapeHTML(p.title)}</h1></div></div><div class="project-overview">${projectPhoto(hero, true)}<aside class="project-sheet" aria-label="Scheda progetto"><h2 class="eyebrow">Scheda progetto</h2><dl class="detail-facts">${facts.map(([label, value]) => '<div><dt>' + escapeHTML(label) + '</dt><dd>' + escapeHTML(value) + '</dd></div>').join('')}</dl>${p.description ? '<p class="project-summary">' + escapeHTML(p.description) + '</p>' : ''}</aside></div><section class="detail-story project-story-layout${panoramicStory ? ' project-story-panorama' : ''}" aria-label="Descrizione dell’intervento"><div class="project-story-visual"><p class="section-label">L’intervento</p>${storyPhoto ? projectPhoto(storyPhoto) : ''}</div><div class="detail-copy"><div class="project-narrative">${story.map(text => '<p>' + escapeHTML(text) + '</p>').join('')}</div>${scope}</div></section>${projectGallery(photos.filter(photo => photo !== hero && photo !== storyPhoto), p.title)}${team}${projectNextLink(p)}</article>`;
}

function collectionDetailPage(p) {
  const photos = orderedProjectPhotos(p);
  const facts = [['Destinatari', p.client], ['Ambito', p.program], ['Stato', p.status]].filter(([, value]) => value);
  return `<article class="collection-detail" aria-labelledby="page-title"><a class="breadcrumb" href="#/progetti">Torna ai progetti</a><div class="detail-heading"><div><p class="eyebrow collection-kicker"><span class="collection-mark" aria-hidden="true"></span>Una raccolta di interventi</p><h1 id="page-title">${escapeHTML(p.title)}</h1></div></div><div class="collection-photo-wall">${projectGallery(photos, p.title, 'mosaic')}</div><section class="project-collection-story" aria-label="Attività e prestazioni"><div><div class="project-narrative">${p.story.map(text => '<p>' + escapeHTML(text) + '</p>').join('')}</div><dl class="collection-facts">${facts.map(([label, value]) => '<div><dt>' + escapeHTML(label) + '</dt><dd>' + escapeHTML(value) + '</dd></div>').join('')}</dl></div><div><h2 class="eyebrow scope-heading">Prestazioni</h2><ul class="scope-list">${p.scope.map(text => '<li>' + escapeHTML(text) + '</li>').join('')}</ul></div></section>${projectNextLink(p)}</article>`;
}

function photoOnlyDetailPage(p) {
  const photos = orderedProjectPhotos(p);
  const hero = projectHero(p, photos);
  return `<article aria-labelledby="page-title"><a class="breadcrumb" href="#/progetti">Torna ai progetti</a><div class="detail-heading"><div><p class="eyebrow">${escapeHTML(categoryName(p.category))}</p><h1 id="page-title">${escapeHTML(p.title)}</h1></div></div>${projectPhoto(hero, true)}${projectGallery(photos.filter(photo => photo !== hero), p.title)}<section class="project-sheet-pending" aria-label="Scheda progetto"><p>Scheda progetto in preparazione.</p></section>${projectNextLink(p)}</article>`;
}

function legacyDetailPage(p) {
  const next = projects[(projects.indexOf(p)+1)%projects.length];
  return `<article aria-labelledby="page-title"><a class="breadcrumb" href="#/profilo">${escapeHTML(categoryName(p.category))}</a><div class="detail-heading"><div><p class="eyebrow">${escapeHTML(categoryName(p.category))} / ${escapeHTML(p.number)}</p><h1 id="page-title">${escapeHTML(p.title)}</h1></div><dl class="detail-facts">${placeLabel(p) ? `<div><dt>Luogo</dt><dd>${escapeHTML(p.place)}</dd></div>` : ''}${p.scale ? `<div><dt>Dimensione</dt><dd>${escapeHTML(p.scale)}</dd></div>` : ''}</dl></div>${p.credit ? `<p class="project-credit">${escapeHTML(p.credit)}</p>` : ''}${p.featured ? placeholder({...p,ratio:'16/9'},'Documentazione visiva da inserire','detail-hero') : ''}<div class="detail-story"><p class="section-label">L’intervento</p><div class="detail-copy"><p class="detail-description">${escapeHTML(p.description)}</p><h2 class="eyebrow scope-heading">Attività svolte</h2><ul class="scope-list">${p.scope.map(s => `<li>${escapeHTML(s)}</li>`).join('')}</ul><a class="text-link" href="#/profilo">Elenco progetti nel profilo </a></div></div><a class="detail-next" href="${projectURL(next)}"><div><p class="eyebrow">Prossimo progetto</p><h2>${escapeHTML(next.title)}</h2></div><span class="project-open">Apri progetto</span></a></article>`;
}

function render() {
  const path = location.hash.slice(1) || '/';
  let active='projects', title='Progetti', html;
  if(path==='/'){active='home';title='Studio';html=homePage();}
  else if(path==='/profilo'){active='profile';title='Profilo';html=profilePage();}
  else if(path==='/contatti'){active='contact';title='Contatti';html=contactPage();}
  else if(path==='/archivio'||path.startsWith('/archivio/')){
    history.replaceState(null,'','#/profilo');
    active='profile';title='Profilo';html=profilePage();
  }
  else if(path.startsWith('/progetti/')){
    const p=projects.find(p=>'/progetti/'+encodeURIComponent(p.id)===path);
    if(p){title=p.title;html=detailPage(p);}else{html=projectsPage();}
  }else{html=projectsPage();}
  document.body.classList.toggle('is-home',active==='home');
  main.innerHTML=html;
  main.setAttribute('aria-busy','false');
  main.classList.remove('page-enter');
  void main.offsetWidth;
  main.classList.add('page-enter');
  document.title=`${title} — STUDIO H2O · Andrea di Bartolomeo`;
  document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  navigation.classList.remove('is-open');menu.setAttribute('aria-expanded','false');
  window.scrollTo({top:0,behavior:'instant'});
  if(hasRendered)main.focus({preventScroll:true});
  hasRendered=true;
}

menu.addEventListener('click',()=>{const open=menu.getAttribute('aria-expanded')!=='true';menu.setAttribute('aria-expanded',String(open));navigation.classList.toggle('is-open',open);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu.getAttribute('aria-expanded')==='true'){navigation.classList.remove('is-open');menu.setAttribute('aria-expanded','false');menu.focus();}});
main.addEventListener('click',e=>{
  const b=e.target.closest('[data-view]');
  if(b){view=b.dataset.view;main.querySelector('.project-grid').classList.toggle('list-view',view==='list');main.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===view)));return;}

});
document.querySelector('.back-top').addEventListener('click',e=>{e.preventDefault();window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});document.querySelector('.identity').focus({preventScroll:true});});
window.addEventListener('hashchange',render);
const embeddedContent=document.querySelector('#site-content');
const loadContent=embeddedContent?Promise.resolve(JSON.parse(embeddedContent.textContent)):fetch('content.json').then(r=>{if(!r.ok)throw new Error('Contenuti non disponibili');return r.json();});
loadContent.then(data=>{content=data;projects=data.projects;domains=data.domains;render();}).catch(()=>{main.setAttribute('aria-busy','false');main.innerHTML='<div class="load-error"><h1>Contenuti non disponibili</h1><p>Ricarica la pagina oppure <a class="text-link" href="mailto:a.dibartolomeo@studioh2o.it">scrivi allo studio</a>.</p></div>';});
</script></body>
</html>
